# Focus areas for `run_tests.sh focus <area>` — PARTIAL verification for routine work inside one area.
# A focus run is never a substitute for `run_tests.sh quick` or `full` before a merge (see game/docs/TESTING.md).
#
# Format: one or more lines per area, `<area>: <selector> <selector> ...` (lines of the same area add up; `#` starts a
# comment). A selector is a whole suite case (`t_property`) or one test of a case (`t_saves.step_registry` — the name as
# the suite report prints it). An unknown area stops run_tests.sh; a selector that matches no case or test is a FAIL.
# Extending: add lines here; prefer whole cases for the area's own cases and single tests for cross-system contracts.

